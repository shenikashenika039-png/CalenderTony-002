<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--panel:#fff;--ink:#1a2233;--mute:#6b7485;--line:#d9dee8;--accent:#3a4ad9;--accent-ink:#fff;--soft:#e8ebf7;--today:#fff6d6;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--panel:#1b2130;--ink:#e8ecf5;--mute:#98a1b5;--line:#2e3649;--accent:#8c98ff;--accent-ink:#10142a;--soft:#262d44;--today:#3a3416;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f;--panel:#1b2130;--ink:#e8ecf5;--mute:#98a1b5;--line:#2e3649;--accent:#8c98ff;--accent-ink:#10142a;--soft:#262d44;--today:#3a3416;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 auto 0 0}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.stats{display:flex;flex-wrap:wrap;gap:14px;color:var(--mute);font-size:13px;margin-bottom:12px}
.stats b{color:var(--ink)}
.scroll{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:826px}
.dow{background:var(--soft);padding:8px 10px;font-weight:600;font-size:13px}
.cell{background:var(--panel);min-height:108px;padding:6px;cursor:pointer;text-align:left;border:0;display:block;width:100%}
.cell:hover{background:var(--soft)}
.cell.out{background:var(--bg);cursor:default}
.cell.today{background:var(--today)}
.num{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:4px}
.today .num{color:var(--ink)}
.chip{font-size:12px;border-left:3px solid var(--c);background:var(--soft);border-radius:4px;padding:2px 6px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;line-height:1.3}.chip small{display:block;color:var(--c);font-weight:700;font-size:10.5px}
.chip.Idea{border-left-style:dashed;background:transparent;outline:1px dashed var(--line)}
.chip.Posted{opacity:.55;text-decoration:line-through}
.chip.Scheduled::after{content:"\2713";margin-left:auto;color:var(--mute)}
.veil{position:fixed;inset:0;background:rgba(10,14,25,.45);display:none;z-index:20}
.veil.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:21}
.panel.on{transform:none}
.panel h2{margin:0 0 12px;font-size:20px}
.entry{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px;margin-bottom:10px;display:grid;gap:8px}
.entry input,.entry select,.entry textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.row{display:grid;grid-template-columns:1fr 1fr 90px;gap:8px}
.entry textarea{min-height:56px;resize:vertical}
.del{justify-self:end;background:none;border:0;color:var(--mute);cursor:pointer;text-decoration:underline;padding:0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px}
.hint{color:var(--mute);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <select class="btn" id="filter" aria-label="Branch filter"></select>
    <button class="btn" id="prev" aria-label="Previous month">&lsaquo; Prev</button>
    <button class="btn" id="today">Today</button>
    <button class="btn" id="next" aria-label="Next month">Next &rsaquo;</button>
  </header>
  <input class="theme" id="theme" placeholder="This month’s theme or goals (for example: launch week, 12 posts, 2 videos)">
  <div class="stats" id="stats"></div>
  <div class="scroll"><div class="grid" id="grid"></div></div>
  <div class="legend" id="legend"></div>
  <p class="hint">Pick a branch at the top to see only its posts. Click any day to add or edit posts; “Add for all 7 branches” creates the same post for every branch. Everything saves automatically in this browser.</p>
</div>
<div class="veil" id="veil"></div>
<aside class="panel" id="panel" aria-label="Day editor"></aside>
<script>
var P={Instagram:'#d6336c',YouTube:'#e03131',LinkedIn:'#1971c2',X:'#6c757d',Facebook:'#4c6ef5',Blog:'#2f9e44',Newsletter:'#f08c00',Other:'#7048e8'};
var S=['Idea','Drafting','Scheduled','Posted'];
var BR=[{n:'Adgro Nagercoil',s:'Adgro NGL',c:'#1971c2'},{n:'Adgro Valliyur',s:'Adgro VLR',c:'#0c8599'},{n:'Adgro Marthandam',s:'Adgro MTD',c:'#5f3dc4'},{n:'Adgro Cuddalore',s:'Adgro CDL',c:'#2b8a3e'},{n:'Mercelys Cafe Valliyur',s:'Mercelys VLR',c:'#e8590c'},{n:'Mercelys Cafe Nagercoil',s:'Mercelys NGL',c:'#c2255c'},{n:'Mercelys Cafe Marthandam',s:'Mercelys MTD',c:'#a8741a'}];
var DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
var D={entries:{},themes:{}},KEY='content-calendar-v1';
try{var raw=localStorage.getItem(KEY);if(raw)D=JSON.parse(raw);D.entries=D.entries||{};D.themes=D.themes||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
var flt=D.filter||'all';
function brOf(e){return e.branch||BR[0].n}
function bo(e){return BR.filter(function(x){return x.n===brOf(e)})[0]||BR[0]}
function match(e){var b=brOf(e);return flt==='all'||b===flt||b.indexOf(flt)===0}
function ne(b,i){var o=BR.filter(function(x){return x.n===b||x.n.indexOf(b)===0})[0]||BR[0];return{id:'e'+Date.now()+(i||0),title:'',platform:'Instagram',branch:o.n,status:'Idea',time:'',notes:''}}
var now=new Date(),y=now.getFullYear(),m=now.getMonth(),sel=null;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function dk(d){return y+'-'+pad(m+1)+'-'+pad(d)}
function mk(){return y+'-'+pad(m+1)}
function render(){
  $('title').textContent=MON[m]+' '+y;
  $('theme').value=D.themes[mk()+'|'+flt]||'';
  var off=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),total=Math.ceil((off+days)/7)*7;
  var h=DOW.map(function(d){return'<div class="dow">'+d+'</div>'}).join('');
  var counts={Idea:0,Drafting:0,Scheduled:0,Posted:0},all=0;
  var t=new Date(),tk=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  for(var i=0;i<total;i++){
    var d=i-off+1;
    if(d<1||d>days){h+='<div class="cell out"></div>';continue}
    var k=dk(d),es=(D.entries[k]||[]).filter(match);
    es.forEach(function(e){counts[e.status]=(counts[e.status]||0)+1;all++});
    h+='<button class="cell'+(k===tk?' today':'')+'" data-d="'+k+'"><div class="num">'+d+'</div>'+
      es.map(function(e){return'<div class="chip '+esc(e.status)+'" style="--c:'+bo(e).c+'"><small>'+esc(bo(e).s+' · '+e.platform)+'</small>'+esc(e.time?e.time+' ':'')+esc(e.title||'Untitled')+'</div>'}).join('')+'</button>';
  }
  $('grid').innerHTML=h;
  $('stats').innerHTML='<span><b>'+all+'</b> posts planned</span>'+S.map(function(s){return'<span><b>'+counts[s]+'</b> '+s.toLowerCase()+'</span>'}).join('');
}
function panel(){
  var es=(D.entries[sel]||[]).filter(match),dt=new Date(sel+'T00:00:00');
  var h='<h2>'+dt.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})+'</h2>';
  h+=es.map(function(e){
    return'<div class="entry" style="--c:'+bo(e).c+'">'+
    '<select data-id="'+e.id+'" data-f="branch" aria-label="Branch">'+BR.map(function(b){return'<option'+(b.n===brOf(e)?' selected':'')+'>'+b.n+'</option>'}).join('')+'</select>'+
    '<input data-id="'+e.id+'" data-f="title" placeholder="Post title or idea" value="'+esc(e.title)+'">'+
    '<div class="row"><select data-id="'+e.id+'" data-f="platform" aria-label="Platform">'+Object.keys(P).map(function(p){return'<option'+(p===e.platform?' selected':'')+'>'+p+'</option>'}).join('')+'</select>'+
    '<select data-id="'+e.id+'" data-f="status" aria-label="Status">'+S.map(function(s){return'<option'+(s===e.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'+
    '<input data-id="'+e.id+'" data-f="time" type="time" aria-label="Time" value="'+esc(e.time)+'"></div>'+
    '<textarea data-id="'+e.id+'" data-f="notes" placeholder="Caption, links, notes">'+esc(e.notes)+'</textarea>'+
    '<button class="del" data-del="'+e.id+'">Delete post</button></div>';
  }).join('');
  h+='<button class="btn primary" id="add">Add post</button> <button class="btn" id="addall">Add for all 7 branches</button> <button class="btn" id="close">Done</button>';
  $('panel').innerHTML=h;
}
function open(k){sel=k;panel();$('panel').classList.add('on');$('veil').classList.add('on')}
function close(){sel=null;$('panel').classList.remove('on');$('veil').classList.remove('on');render()}
$('grid').addEventListener('click',function(e){var c=e.target.closest('[data-d]');if(c)open(c.dataset.d)});
$('veil').addEventListener('click',close);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sel)close()});
$('panel').addEventListener('input',function(e){
  var id=e.target.dataset.id,f=e.target.dataset.f;if(!id)return;
  (D.entries[sel]||[]).forEach(function(x){if(x.id===id)x[f]=e.target.value});
  save();
  if(f==='branch')e.target.closest('.entry').style.setProperty('--c',bo({branch:e.target.value}).c);
});
$('panel').addEventListener('click',function(e){
  var t=e.target;
  if(t.id==='close'){close();return}
  if(t.id==='addall'){var L=(D.entries[sel]=D.entries[sel]||[]);BR.forEach(function(b,i){L.push(ne(b.n,i))});save();panel();return}
  if(t.id==='add'){(D.entries[sel]=D.entries[sel]||[]).push(ne(flt));save();panel();var ins=$('panel').querySelectorAll('[data-f="title"]');ins[ins.length-1].focus();return}
  if(t.dataset.del){D.entries[sel]=(D.entries[sel]||[]).filter(function(x){return x.id!==t.dataset.del});if(!D.entries[sel].length)delete D.entries[sel];save();panel()}
});
$('theme').addEventListener('input',function(e){D.themes[mk()+'|'+flt]=e.target.value;save()});
$('filter').innerHTML='<option value="all">All branches</option><option value="Adgro">All Adgro</option><option value="Mercelys">All Mercelys Cafe</option>'+BR.map(function(b){return'<option value="'+b.n+'">'+b.n+'</option>'}).join('');
$('filter').value=flt;
$('filter').onchange=function(){flt=this.value;D.filter=flt;save();render()};
function go(n){m+=n;if(m<0){m=11;y--}if(m>11){m=0;y++}render()}
$('prev').onclick=function(){go(-1)};$('next').onclick=function(){go(1)};
$('today').onclick=function(){var t=new Date();y=t.getFullYear();m=t.getMonth();render()};
$('legend').innerHTML=BR.map(function(b){return'<span style="--c:'+b.c+'"><i></i>'+b.n+'</span>'}).join('');
render();
</script>
</body>
</html>
